<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#F8FAFC;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- Header Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════════
       TOP SLIDE HEADER
  ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 45)">
    <!-- Team Tag -->
    <rect x="0" y="0" width="130" height="38" rx="19" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" letter-spacing="1px">TEAM ARC</text>
    
    <!-- Title -->
    <text x="160" y="28" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.5px">IMPACT AND BENEFITS</text>
    <text x="0" y="65" font-size="16" font-weight="600" fill="#64748B">Target Audience Value Proposition &amp; Multi-Dimensional Impact Matrix (Social, Economic, Environmental)</text>

    <!-- SIH Badge -->
    <rect x="1560" y="-10" width="200" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="1660" y="20" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">SIH 2026</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SECTION 1: TARGET AUDIENCE IMPACT (4 TILES)
  ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="0.5px">🎯 PERSONA-SPECIFIC TARGET AUDIENCE IMPACT</text>
    
    <!-- TILE 1: Farmers & Agromet -->
    <g transform="translate(0, 15)" filter="url(#cardShadow)">
      <rect width="420" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="420" height="52" rx="18" fill="#ECFDF5"/>
      <text x="20" y="33" font-size="20">🌾</text>
      <text x="54" y="33" font-size="16" font-weight="800" fill="#065F46">Farmers &amp; Kisan Agromet</text>

      <foreignObject x="18" y="62" width="384" height="205">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;color:#334155;line-height:1.45;">
          <div style="font-weight:700;color:#047857;margin-bottom:6px;font-size:13.5px;">FAO-56 ET₀ &amp; Meghdoot Advisory</div>
          <div style="margin-bottom:4px;">• Daily crop evapotranspiration calculations</div>
          <div style="margin-bottom:4px;">• Smart irrigation timing saves 20-30% water</div>
          <div style="margin-bottom:4px;">• Prevents fertilizer wash-off before downpours</div>
          <div style="margin-bottom:10px;">• Growth-stage advisories in regional vernacular</div>
          <div style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;padding:6px 10px;text-align:center;font-weight:800;color:#047857;font-size:12.5px;">
            ROI: ₹3,000 – ₹5,000 / Acre / Season
          </div>
        </div>
      </foreignObject>
    </g>

    <!-- TILE 2: Coastal & Fishermen -->
    <g transform="translate(445, 15)" filter="url(#cardShadow)">
      <rect width="420" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="420" height="52" rx="18" fill="#F0F9FF"/>
      <text x="20" y="33" font-size="20">🎣</text>
      <text x="54" y="33" font-size="16" font-weight="800" fill="#075985">Coastal &amp; Fishermen</text>

      <foreignObject x="18" y="62" width="384" height="205">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;color:#334155;line-height:1.45;">
          <div style="font-weight:700;color:#0284C7;margin-bottom:6px;font-size:13.5px;">INCOIS Wave Flux &amp; Swell Dynamics</div>
          <div style="margin-bottom:4px;">• Real-time wave power &amp; swell surge metrics</div>
          <div style="margin-bottom:4px;">• High/Low tide clocks for harbor navigation</div>
          <div style="margin-bottom:4px;">• Commercial Port Danger Signals (1 to 11)</div>
          <div style="margin-bottom:10px;">• Prevents boat capsizing &amp; lost fishing days</div>
          <div style="background:#F0F9FF;border:1px solid #BAE6FD;border-radius:8px;padding:6px 10px;text-align:center;font-weight:800;color:#0284C7;font-size:12.5px;">
            Safety: Zero Marine Craft Asset Loss
          </div>
        </div>
      </foreignObject>
    </g>

    <!-- TILE 3: Outdoor Workers & Commuters -->
    <g transform="translate(890, 15)" filter="url(#cardShadow)">
      <rect width="420" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="420" height="52" rx="18" fill="#FFF7ED"/>
      <text x="20" y="33" font-size="20">🏃</text>
      <text x="54" y="33" font-size="16" font-weight="800" fill="#9A3412">Workers &amp; Commuters</text>

      <foreignObject x="18" y="62" width="384" height="205">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;color:#334155;line-height:1.45;">
          <div style="font-weight:700;color:#EA580C;margin-bottom:6px;font-size:13.5px;">Stull WBGT &amp; Highway Radar</div>
          <div style="margin-bottom:4px;">• WBGT heat strain index prevents heat stroke</div>
          <div style="margin-bottom:4px;">• Optimal morning/evening outdoor windows</div>
          <div style="margin-bottom:4px;">• Highway corridor speed &amp; waterlogging alerts</div>
          <div style="margin-bottom:10px;">• Real-time transit navigation safety scores</div>
          <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:6px 10px;text-align:center;font-weight:800;color:#C2410C;font-size:12.5px;">
            Health: Zero Heat Illness Episodes
          </div>
        </div>
      </foreignObject>
    </g>

    <!-- TILE 4: Vulnerable Health -->
    <g transform="translate(1335, 15)" filter="url(#cardShadow)">
      <rect width="425" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="425" height="52" rx="18" fill="#FAF5FF"/>
      <text x="20" y="33" font-size="20">🫁</text>
      <text x="54" y="33" font-size="16" font-weight="800" fill="#6B21A8">Vulnerable Health Demographics</text>

      <foreignObject x="18" y="62" width="389" height="205">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;color:#334155;line-height:1.45;">
          <div style="font-weight:700;color:#9333EA;margin-bottom:6px;font-size:13.5px;">CPCB Sub-Index AQI &amp; Allergens</div>
          <div style="margin-bottom:4px;">• PM2.5, PM10, NO₂, SO₂ dominant pollutant split</div>
          <div style="margin-bottom:4px;">• Proactive dust &amp; pollen inhalation warnings</div>
          <div style="margin-bottom:4px;">• Custom alerts for elderly, asthmatic &amp; kids</div>
          <div style="margin-bottom:10px;">• Proactive medication &amp; inhaler reminders</div>
          <div style="background:#FAF5FF;border:1px solid #E9D5FF;border-radius:8px;padding:6px 10px;text-align:center;font-weight:800;color:#7E22CE;font-size:12.5px;">
            Protection: Proactive Medical Defense
          </div>
        </div>
      </foreignObject>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SECTION 2: 3-PILLAR BENEFIT MATRIX (SOCIAL, ECONOMIC, ENVIRONMENTAL)
  ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 485)">
    <text x="0" y="0" font-size="17" font-weight="800" fill="#0F172A" letter-spacing="0.5px">🌐 HOLISTIC 3-PILLAR BENEFIT MATRIX</text>
    
    <!-- PILLAR 1: SOCIAL IMPACT -->
    <g transform="translate(0, 15)" filter="url(#cardShadow)">
      <rect width="565" height="505" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M 0 22 C 0 9.849 9.849 0 22 0 L 543 0 C 555.151 0 565 9.849 565 22 L 565 72 L 0 72 Z" fill="url(#purpleGrad)"/>
      <circle cx="42" cy="36" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="42" y="42" text-anchor="middle" font-size="18">👥</text>
      <text x="70" y="32" font-size="18" font-weight="800" fill="#FFFFFF">Social Impact &amp; Public Safety</text>
      <text x="70" y="54" font-size="13.5" font-weight="600" fill="#DDD6FE">Inclusive Life-Saving Weather Intelligence</text>

      <foreignObject x="24" y="86" width="517" height="405">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#334155;line-height:1.45;">
          
          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Disaster Early Warning Lead Times</div>
            <div style="color:#475569;margin-top:2px;">120-hour RSMC cyclone cone tracks &amp; Damini lightning alerts provide actionable evacuation windows for administrations.</div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Zero-Literacy Vernacular Voice Access</div>
            <div style="color:#475569;margin-top:2px;">Voice AI (English, हिन्दी, ಕನ್ನಡ) eliminates text barriers, democratizing critical weather insights across 1.4B citizens.</div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Public Health &amp; Heatwave Shield</div>
            <div style="color:#475569;margin-top:2px;">Proactive WBGT and pollution triggers reduce emergency room admissions during severe heatwaves and toxic smog episodes.</div>
          </div>

          <div style="margin-bottom:16px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Crowdsourced Community Ground-Truthing</div>
            <div style="color:#475569;margin-top:2px;">Citizen hazard pins with peer verification alert neighborhoods to active waterlogging, fallen trees, and flash floods.</div>
          </div>

          <div style="background:#FAF5FF;border:1px solid #E9D5FF;border-radius:10px;padding:10px;text-align:center;font-weight:800;color:#7C3AED;font-size:13.5px;">
            KPI: 100% Inclusivity &amp; Faster Evacuation Response
          </div>
        </div>
      </foreignObject>
    </g>

    <!-- PILLAR 2: ECONOMIC BENEFITS -->
    <g transform="translate(595, 15)" filter="url(#cardShadow)">
      <rect width="565" height="505" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M 0 22 C 0 9.849 9.849 0 22 0 L 543 0 C 555.151 0 565 9.849 565 22 L 565 72 L 0 72 Z" fill="url(#blueGrad)"/>
      <circle cx="42" cy="36" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="42" y="42" text-anchor="middle" font-size="18">💰</text>
      <text x="70" y="32" font-size="18" font-weight="800" fill="#FFFFFF">Economic &amp; Livelihood ROI</text>
      <text x="70" y="54" font-size="13.5" font-weight="600" fill="#E0F2FE">Direct Farmer, Fishermen &amp; Municipal Cost Savings</text>

      <foreignObject x="24" y="86" width="517" height="405">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#334155;line-height:1.45;">
          
          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Agricultural Input Cost Reduction</div>
            <div style="color:#475569;margin-top:2px;">Synchronizing fertilizer &amp; pesticide spraying with rain probability avoids wash-off, saving ₹3,000–₹5,000 per acre per season.</div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Marine Craft &amp; Gear Asset Protection</div>
            <div style="color:#475569;margin-top:2px;">INCOIS swell warnings prevent offshore vessel capsizing and multi-lakh rupee fishing net destruction during squally seas.</div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Workforce Productivity Optimization</div>
            <div style="color:#475569;margin-top:2px;">Shift scheduling aligned to thermal stress windows preserves construction &amp; agricultural labor output without heat exhaustion.</div>
          </div>

          <div style="margin-bottom:16px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Infrastructure Damage Mitigation</div>
            <div style="color:#475569;margin-top:2px;">Corridor nowcasts allow transport logistics operators to reroute fleets, cutting vehicle flood damage and transit delays.</div>
          </div>

          <div style="background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:10px;text-align:center;font-weight:800;color:#0284C7;font-size:13.5px;">
            ROI: Massive Direct Savings Across Agrarian &amp; Marine Belts
          </div>
        </div>
      </foreignObject>
    </g>

    <!-- PILLAR 3: ENVIRONMENTAL RESILIENCE -->
    <g transform="translate(1190, 15)" filter="url(#cardShadow)">
      <rect width="570" height="505" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M 0 22 C 0 9.849 9.849 0 22 0 L 548 0 C 560.151 0 570 9.849 570 22 L 570 72 L 0 72 Z" fill="url(#emeraldGrad)"/>
      <circle cx="42" cy="36" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="42" y="42" text-anchor="middle" font-size="18">🌿</text>
      <text x="70" y="32" font-size="18" font-weight="800" fill="#FFFFFF">Environmental &amp; Climate Resilience</text>
      <text x="70" y="54" font-size="13.5" font-weight="600" fill="#D1FAE5">Resource Conservation &amp; Urban Adaptation</text>

      <foreignObject x="24" y="86" width="522" height="405">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#334155;line-height:1.45;">
          
          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Freshwater Conservation (20–30%)</div>
            <div style="color:#475569;margin-top:2px;">Evapotranspiration (ET₀) precision irrigation eliminates over-watering and preserves critical groundwater reserves.</div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Elimination of Agrochemical Leaching</div>
            <div style="color:#475569;margin-top:2px;">Preventing chemical drift reduces pesticide percolation into aquifers, protecting freshwater drinking reservoirs and rivers.</div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Proactive Municipal Dewatering</div>
            <div style="color:#475569;margin-top:2px;">Localized rainfall accumulation alerts enable smart cities to pre-activate stormwater pumps before underpasses flood.</div>
          </div>

          <div style="margin-bottom:16px;">
            <div style="font-weight:800;color:#1E293B;font-size:14.5px;">• Climate-Aware Urban Planning</div>
            <div style="color:#475569;margin-top:2px;">Historical telemetry logs empower municipal bodies to map urban heat islands and waterlogging hotspots for green buffers.</div>
          </div>

          <div style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:10px;padding:10px;text-align:center;font-weight:800;color:#059669;font-size:13.5px;">
            Outcome: Sustainable Groundwater &amp; Climate Resilience
          </div>
        </div>
      </foreignObject>
    </g>
  </g>
</svg>
