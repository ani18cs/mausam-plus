  <!-- CARD 3: MITIGATION & VIABILITY STRATEGIES -->
  <g transform="translate(1290, 160)" filter="url(#cardShadow)">
    <rect width="550" height="850" rx="24" fill="url(#greenCardBg)" stroke="#A7F3D0" stroke-width="2"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 L 526 0 C 539.255 0 550 10.745 550 24 L 550 95 L 0 95 Z" fill="url(#greenHeaderGrad)"/>
    <circle cx="50" cy="48" r="22" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="50" y="55" text-anchor="middle" font-size="22" fill="#FFFFFF">🛡️</text>
    <text x="88" y="42" font-size="20" font-weight="800" fill="#FFFFFF">Mitigation Strategies</text>
    <text x="88" y="68" font-size="18" font-weight="700" fill="#D1FAE5">&amp; Viability Solutions</text>

    <!-- Strategy 1 -->
    <g transform="translate(30, 125)">
      <rect width="490" height="150" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#D1FAE5"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">💾</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#047857">100% Offline Emergency Caching</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• PWA Service Worker caching &amp; local storage hydration</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Pre-synced emergency maps, radar loops &amp; safety SOPs</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Instant zero-connectivity access during active storms</text>
      <text x="64" y="124" font-size="13" font-weight="700" fill="#059669">Efficacy: 100% Offline Availability</text>
    </g>

    <!-- Strategy 2 -->
    <g transform="translate(30, 295)">
      <rect width="490" height="150" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#D1FAE5"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">📐</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#047857">Grounded Dual-RAG &amp; Audit Trail</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• Strict RAG anchored to verified IMD/NDMA guidelines</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Mathematical proofs for Stull WBGT, FAO-56 ET0</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Inspectable audit log: "Why this alert?" with citations</text>
      <text x="64" y="124" font-size="13" font-weight="700" fill="#059669">Accuracy: Zero AI Hallucinations</text>
    </g>

    <!-- Strategy 3 -->
    <g transform="translate(30, 465)">
      <rect width="490" height="160" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#D1FAE5"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">🎙️</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#047857">Multilingual Vernacular Voice AI</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• Natural female voice TTS in English, हिन्दी, ಕನ್ನಡ</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Instant audio cancellation &amp; continuous speech mic</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Plainspoken conversational answers without jargon</text>
      <text x="64" y="124" font-size="13" font-weight="700" fill="#059669">Inclusivity: Zero-Literacy Accessible</text>
    </g>

    <!-- Strategy 4 -->
    <g transform="translate(30, 645)">
      <rect width="490" height="170" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#D1FAE5"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">👥</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#047857">Crowdsourced Ground-Truthing</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• Citizen hazard reporting wizard with photo verification</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Real-time community upvotes &amp; geo-clustering</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Validates waterlogging &amp; micro-scale weather events</text>
      <text x="64" y="126" font-size="13" font-weight="700" fill="#059669">Coverage: Hyperlocal Street-Level</text>
