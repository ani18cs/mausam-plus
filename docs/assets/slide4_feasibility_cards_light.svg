    <!-- Risk 2 -->
    <g transform="translate(30, 295)">
      <rect width="490" height="150" rx="16" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#FFE4E6"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">🤖</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#BE123C">AI Hallucinations in Disaster SOPs</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• Generative LLMs fabricating unverified safety steps</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Incorrect evacuation routes or distorted risk levels</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Severe liability &amp; life safety implications</text>
      <text x="64" y="124" font-size="13" font-weight="800" fill="#E11D48">Risk Severity: HIGH</text>
    </g>

    <!-- Risk 3 -->
    <g transform="translate(30, 465)">
      <rect width="490" height="160" rx="16" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#FFE4E6"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">🗣️</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#BE123C">Rural Low-Bandwidth &amp; Dialects</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• 2G/3G high packet loss in remote agricultural belts</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Complex meteorological scientific vocabulary</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Low text literacy among farmers &amp; coastal fishermen</text>
      <text x="64" y="124" font-size="13" font-weight="800" fill="#E11D48">Risk Severity: HIGH</text>
    </g>

    <!-- Risk 4 -->
    <g transform="translate(30, 645)">
      <rect width="490" height="170" rx="16" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="16" fill="#FFE4E6"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">⛰️</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#BE123C">Radar Blindspots &amp; Sensor Lag</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• Mountainous terrain blocking radar beam lines of sight</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Discrepancies between satellite models &amp; local rain</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Hyperlocal flash floods occurring between station grids</text>
      <text x="64" y="126" font-size="13" font-weight="800" fill="#E11D48">Risk Severity: MEDIUM</text>
    </g>
