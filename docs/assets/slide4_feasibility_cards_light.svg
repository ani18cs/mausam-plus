      <circle cx="36" cy="36" r="16" fill="#FFE4E6"/>
      <text x="36" y="42" text-anchor="middle" font-size="16">📡</text>
      <text x="64" y="34" font-size="17" font-weight="800" fill="#BE123C">Extreme Weather Network Outages</text>
      <text x="64" y="58" font-size="14" font-weight="600" fill="#334155">• Cellular towers collapse during cyclones and floods</text>
      <text x="64" y="80" font-size="14" font-weight="600" fill="#334155">• Total loss of active internet connectivity in disaster zones</text>
      <text x="64" y="102" font-size="14" font-weight="600" fill="#334155">• Citizens unable to fetch live cloud warnings</text>
      <text x="64" y="124" font-size="13" font-weight="800" fill="#E11D48">Risk Severity: CRITICAL</text>
