<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#F8FAFC;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    
    <!-- Header Gradients -->
    <linearGradient id="blueHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="redHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="greenHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="blueCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="redCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>
    <linearGradient id="greenCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════════
       TOP SLIDE HEADER
  ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(80, 45)">
    <!-- Team Tag -->
    <rect x="0" y="0" width="130" height="38" rx="19" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" letter-spacing="1px">TEAM ARC</text>
    
    <!-- Title -->
    <text x="160" y="28" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.5px">FEASIBILITY AND VIABILITY</text>
    <text x="0" y="65" font-size="16" font-weight="600" fill="#64748B">Architectural Readiness, Threat Modeling &amp; Mitigation Framework for National Scale Deployment</text>

    <!-- SIH Badge -->
    <rect x="1560" y="-10" width="200" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="1660" y="20" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">SIH 2026</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════════
       3-CARD MAIN GRID
  ═══════════════════════════════════════════════════════════════════════ -->

  <!-- CARD 1: TECHNICAL & OPERATIONAL FEASIBILITY -->
  <g transform="translate(80, 145)" filter="url(#cardShadow)">
    <rect width="550" height="880" rx="24" fill="url(#blueCardBg)" stroke="#BAE6FD" stroke-width="2"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 L 526 0 C 539.255 0 550 10.745 550 24 L 550 90 L 0 90 Z" fill="url(#blueHeaderGrad)"/>
    <circle cx="48" cy="45" r="22" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="48" y="52" text-anchor="middle" font-size="22" fill="#FFFFFF">⚙️</text>
    <text x="84" y="40" font-size="19" font-weight="800" fill="#FFFFFF">Technical &amp; Operational</text>
    <text x="84" y="64" font-size="16" font-weight="700" fill="#E0F2FE">Feasibility Analysis</text>

    <foreignObject x="20" y="105" width="510" height="755">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;gap:14px;">
        
        <!-- Item 1 -->
        <div style="background:#FFFFFF;border:1.5px solid #E0F2FE;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">📱</span>
            <span style="font-weight:800;color:#0369A1;font-size:15px;">React 18 &amp; Capacitor 8 Native Engine</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Unified cross-platform codebase for Android, iOS &amp; PWA</div>
            <div>• Zero code duplication across web &amp; mobile binaries</div>
            <div>• 60fps hardware-accelerated fluid UI on budget smartphones</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#0284C7;margin-top:6px;">Status: 100% Production Ready</div>
        </div>

        <!-- Item 2 -->
        <div style="background:#FFFFFF;border:1.5px solid #E0F2FE;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">⚡</span>
            <span style="font-weight:800;color:#0369A1;font-size:15px;">High-Throughput Node BFF &amp; Redis</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Stateless Express BFF with in-memory Redis caching</div>
            <div>• Sub-100ms response latency under heavy peak bursts</div>
            <div>• 75% payload compression vs raw meteorological feeds</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#0284C7;margin-top:6px;">Metric: &lt; 95ms Endpoint Latency</div>
        </div>

        <!-- Item 3 -->
        <div style="background:#FFFFFF;border:1.5px solid #E0F2FE;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">🛰️</span>
            <span style="font-weight:800;color:#0369A1;font-size:15px;">Direct IMD, CPCB &amp; INCOIS Ingestion</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Ingests 37 Doppler Radars &amp; INSAT-3DS Multi-Spectral Satellites</div>
            <div>• CPCB live PM2.5/PM10 CAAQMS pollution telemetry</div>
            <div>• INCOIS ocean wave swell flux &amp; Damini lightning data</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#0284C7;margin-top:6px;">Coverage: All India Multi-Agency</div>
        </div>

        <!-- Item 4 -->
        <div style="background:#FFFFFF;border:1.5px solid #E0F2FE;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">🧩</span>
            <span style="font-weight:800;color:#0369A1;font-size:15px;">Modular Universal Card Registry</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Dynamic card registry with weighted persona scoring</div>
            <div>• Plug-and-play architecture for new sectoral modules</div>
            <div>• Zero breaking changes during future MoES deployments</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#0284C7;margin-top:6px;">Architecture: 100% Extensible Registry</div>
        </div>

      </div>
    </foreignObject>
  </g>

  <!-- CARD 2: POTENTIAL CHALLENGES & RISKS -->
  <g transform="translate(685, 145)" filter="url(#cardShadow)">
    <rect width="550" height="880" rx="24" fill="url(#redCardBg)" stroke="#FECDD3" stroke-width="2"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 L 526 0 C 539.255 0 550 10.745 550 24 L 550 90 L 0 90 Z" fill="url(#redHeaderGrad)"/>
    <circle cx="48" cy="45" r="22" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="48" y="52" text-anchor="middle" font-size="22" fill="#FFFFFF">⚠️</text>
    <text x="84" y="40" font-size="19" font-weight="800" fill="#FFFFFF">Potential Challenges</text>
    <text x="84" y="64" font-size="16" font-weight="700" fill="#FFE4E6">&amp; Operational Risks</text>

    <foreignObject x="20" y="105" width="510" height="755">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;gap:14px;">
        
        <!-- Risk 1 -->
        <div style="background:#FFFFFF;border:1.5px solid #FFE4E6;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">📡</span>
            <span style="font-weight:800;color:#BE123C;font-size:15px;">Extreme Weather Network Blackouts</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Cellular towers collapse during cyclones, floods &amp; severe storms</div>
            <div>• Complete loss of internet connectivity in ground zero disaster zones</div>
            <div>• Citizens unable to fetch live cloud warnings during peak peril</div>
          </div>
          <div style="font-size:11.5px;font-weight:800;color:#E11D48;margin-top:6px;">Risk Severity: CRITICAL</div>
        </div>

        <!-- Risk 2 -->
        <div style="background:#FFFFFF;border:1.5px solid #FFE4E6;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">🤖</span>
            <span style="font-weight:800;color:#BE123C;font-size:15px;">AI Hallucinations in Disaster SOPs</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Generative LLMs fabricating unverified safety guidelines</div>
            <div>• Incorrect evacuation guidance or distorted hazard thresholds</div>
            <div>• Severe liability &amp; life safety implications during emergencies</div>
          </div>
          <div style="font-size:11.5px;font-weight:800;color:#E11D48;margin-top:6px;">Risk Severity: HIGH</div>
        </div>

        <!-- Risk 3 -->
        <div style="background:#FFFFFF;border:1.5px solid #FFE4E6;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">🗣️</span>
            <span style="font-weight:800;color:#BE123C;font-size:15px;">Rural Low-Bandwidth &amp; Dialect Gaps</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• 2G/3G high packet loss in remote agricultural &amp; coastal belts</div>
            <div>• Complex meteorological terminology creating confusion</div>
            <div>• Low text literacy among farmers &amp; small-scale fishermen</div>
          </div>
          <div style="font-size:11.5px;font-weight:800;color:#E11D48;margin-top:6px;">Risk Severity: HIGH</div>
        </div>

        <!-- Risk 4 -->
        <div style="background:#FFFFFF;border:1.5px solid #FFE4E6;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">⛰️</span>
            <span style="font-weight:800;color:#BE123C;font-size:15px;">Radar Blindspots &amp; Sensor Lags</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Mountainous terrain blocking radar beam line-of-sight</div>
            <div>• Discrepancies between satellite models &amp; local rain bursts</div>
            <div>• Micro-scale flash floods occurring between station grids</div>
          </div>
          <div style="font-size:11.5px;font-weight:800;color:#E11D48;margin-top:6px;">Risk Severity: MEDIUM</div>
        </div>

      </div>
    </foreignObject>
  </g>

  <!-- CARD 3: MITIGATION & VIABILITY STRATEGIES -->
  <g transform="translate(1290, 145)" filter="url(#cardShadow)">
    <rect width="550" height="880" rx="24" fill="url(#greenCardBg)" stroke="#A7F3D0" stroke-width="2"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 L 526 0 C 539.255 0 550 10.745 550 24 L 550 90 L 0 90 Z" fill="url(#greenHeaderGrad)"/>
    <circle cx="48" cy="45" r="22" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="48" y="52" text-anchor="middle" font-size="22" fill="#FFFFFF">🛡️</text>
    <text x="84" y="40" font-size="19" font-weight="800" fill="#FFFFFF">Mitigation Strategies</text>
    <text x="84" y="64" font-size="16" font-weight="700" fill="#D1FAE5">&amp; Viability Solutions</text>

    <foreignObject x="20" y="105" width="510" height="755">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;gap:14px;">
        
        <!-- Strategy 1 -->
        <div style="background:#FFFFFF;border:1.5px solid #D1FAE5;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">💾</span>
            <span style="font-weight:800;color:#047857;font-size:15px;">100% Offline Emergency Caching</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• PWA Service Worker caching &amp; local storage state hydration</div>
            <div>• Pre-synced emergency maps, radar loops &amp; disaster SOPs</div>
            <div>• Instant zero-connectivity access during active landfalls</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#059669;margin-top:6px;">Efficacy: 100% Offline Availability</div>
        </div>

        <!-- Strategy 2 -->
        <div style="background:#FFFFFF;border:1.5px solid #D1FAE5;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">📐</span>
            <span style="font-weight:800;color:#047857;font-size:15px;">Grounded Dual-RAG &amp; Audit Trail</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Strict RAG anchored directly to verified IMD/NDMA guidelines</div>
            <div>• Mathematical proofs for Stull WBGT, FAO-56 ET₀ &amp; Wave Flux</div>
            <div>• Inspectable audit log: "Why this alert?" with citations</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#059669;margin-top:6px;">Accuracy: Zero AI Hallucinations</div>
        </div>

        <!-- Strategy 3 -->
        <div style="background:#FFFFFF;border:1.5px solid #D1FAE5;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">🎙️</span>
            <span style="font-weight:800;color:#047857;font-size:15px;">Multilingual Vernacular Voice AI</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Natural female voice TTS in English, हिन्दी, ಕನ್ನಡ</div>
            <div>• Instant audio cancellation &amp; continuous speech mic input</div>
            <div>• Plainspoken guidance without complex meteorological jargon</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#059669;margin-top:6px;">Inclusivity: Zero-Literacy Accessible</div>
        </div>

        <!-- Strategy 4 -->
        <div style="background:#FFFFFF;border:1.5px solid #D1FAE5;border-radius:14px;padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">👥</span>
            <span style="font-weight:800;color:#047857;font-size:15px;">Crowdsourced Ground-Truthing</span>
          </div>
          <div style="font-size:12.5px;color:#334155;line-height:1.45;">
            <div>• Citizen hazard reporting wizard with photo verification</div>
            <div>• Real-time community upvotes &amp; geographic clustering</div>
            <div>• Validates street waterlogging &amp; radar blindspot events</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#059669;margin-top:6px;">Coverage: Hyperlocal Street-Level</div>
        </div>

      </div>
    </foreignObject>
  </g>
</svg>
